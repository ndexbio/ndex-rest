name: Release

# Publishing a GitHub release runs this; its tag's prefix picks the jobs that run:
#   v<version>                 publishes ndexbio/ndex-rest:<version> (multi-arch) and attaches
#                              ndex-mcp.mcpb and McpManifest-<tag>.md to the release.
#   ndex-rest-helm-v<version>  publishes the Helm chart ndex-rest-helm-<version>.tgz to
#                              oci://registry-1.docker.io/ndexbio/ndex-rest-helm and attaches it
#                              to the release; refused unless <version> is the chart's own and
#                              the image it deploys (its appVersion) is already on Docker Hub.
# Release them in that order: the image, then the chart that deploys it.
on:
  release:
    types: [published]
  push:
    tags:
      - '*'
      - '!ndex-rest-helm-v*'

jobs:
  build-mcpb:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'ndex-rest-helm-v')

    steps:
      - uses: actions/checkout@v4

      - name: Build Claude Desktop extension
        run: make build_claude_mcpb

      - name: Upload ndex-mcp.mcpb to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "build/ndex-mcp.mcpb" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-manifest:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'ndex-rest-helm-v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate McpManifest.md
        run: make mcp-manifest

      - name: Upload McpManifest to release
        run: |
          cp target/generated-resources/McpManifest.md \
             "McpManifest-${{ github.event.release.tag_name }}.md"
          gh release upload "${{ github.event.release.tag_name }}" \
            "McpManifest-${{ github.event.release.tag_name }}.md" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-push:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.release.tag_name, 'ndex-rest-helm-v') }}

    steps:
      - name: Determine Docker tag / detect duplicate
        id: setup
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
              echo "docker_tag=$VERSION" >> $GITHUB_OUTPUT
            else
              echo "docker_tag=$TAG" >> $GITHUB_OUTPUT
            fi
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.ref_name }}"
            if gh api repos/${{ github.repository }}/releases/tags/$TAG > /dev/null 2>&1; then
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "docker_tag=$TAG" >> $GITHUB_OUTPUT
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.setup.outputs.skip != 'true'

      - name: Set up QEMU (for arm64 cross-compilation)
        if: steps.setup.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.setup.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          name: ndex-builder

      - name: Log in to Docker Hub
        if: steps.setup.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build multi-platform image and push manifest
        if: steps.setup.outputs.skip != 'true'
        env:
          DOCKER_REPO: ndexbio/ndex-rest
          DOCKER_TAG: ${{ steps.setup.outputs.docker_tag }}
        run: make push-docker

  push-chart:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'ndex-rest-helm-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # the pinned helm comes from the Makefile, as in make test
      - run: make helm-push helm-attach CHART_TAG="${TAG#ndex-rest-helm-v}"
        env:
          TAG: ${{ github.event.release.tag_name }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
